[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgpt-refactor"
version = "0.1.0"
description = "A minimal LangGraph AgentGPT with a unified MCP tool layer"
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk[http-server]==1.3.0",
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "langchain-openai>=0.3,<2", "mcp>=1.12,<2",
  "httpx>=0.28,<1", "pydantic-settings>=2.6,<3",
  "aiosqlite>=0.20,<1", "ddgs>=9", "pypdf>=5,<7",
  "python-multipart", "jsonschema>=4",
  "qdrant-client[fastembed]>=1.15,<2",
  "portalocker>=2,<5",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.setuptools.packages.find]
include = ["agentgpt*"]

[tool.setuptools.package-data]
agentgpt = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
